<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>GStreamer Dots WASM Demo</title>
  <style>
    :root {
      --bg: #1a1a2e;
      --surface: #16213e;
      --surface2: #0f3460;
      --accent: #e94560;
      --text: #eee;
      --text-dim: #999;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    header {
      background: var(--surface);
      width: 100%;
      padding: 12px 24px;
      display: flex;
      align-items: center;
      gap: 16px;
      border-bottom: 1px solid var(--surface2);
    }

    header h1 { font-size: 18px; color: var(--accent); }
    header .badge {
      font-size: 10px;
      background: var(--surface2);
      padding: 2px 8px;
      border-radius: 10px;
      color: var(--text-dim);
    }

    .canvas-container {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      width: 100%;
      background: #000;
    }

    #canvas {
      max-width: 100%;
      max-height: 100%;
      background: #111;
    }

    .status-bar {
      background: var(--surface2);
      width: 100%;
      padding: 6px 24px;
      font-size: 12px;
      color: var(--text-dim);
    }

    #loading-overlay {
      position: fixed;
      inset: 0;
      background: var(--bg);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 1000;
      transition: opacity 0.5s;
    }

    #loading-overlay.hidden {
      opacity: 0;
      pointer-events: none;
    }

    #loading-overlay h1 { color: var(--accent); margin-bottom: 16px; }

    .spinner {
      width: 40px; height: 40px;
      border: 3px solid var(--surface2);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin { to { transform: rotate(360deg); } }

    #loading-overlay p {
      margin-top: 16px;
      color: var(--text-dim);
      font-size: 13px;
    }

    #load-status {
      margin-top: 8px;
      color: var(--text-dim);
      font-size: 11px;
      font-family: monospace;
    }
  </style>
</head>
<body>
  <div id="loading-overlay">
    <h1>GStreamer Dots WASM Demo</h1>
    <div class="spinner"></div>
    <p>Loading GStreamer...</p>
    <div id="load-status"></div>
  </div>

  <header>
    <h1>GStreamer Dots WASM Demo</h1>
    <span class="badge">videotestsrc | GST_TRACERS=dots</span>
  </header>

  <div class="canvas-container">
    <canvas id="canvas" width="640" height="480"></canvas>
  </div>

  <div class="status-bar">
    <span id="status-text">Initializing...</span>
  </div>

  <!-- Dots viewer WASM bundle (d3, d3-graphviz, fuse, etc.) -->
  <script src="gst-dots-wasm-bundle.js"></script>
  <!-- Dots viewer WASM module (auto-injects floating panel) -->
  <script src="gst-dots-wasm.js"></script>

  <script>
    var _cacheBust = 'v=' + Date.now();
    var Module = {
      canvas: document.getElementById('canvas'),
      locateFile: function(path) {
        return path + '?' + _cacheBust;
      },
      ENV: {
        'GST_TRACERS': 'dots',
        'GST_DEBUG': '2'
      },
      print: function(text) {
        console.log(text);
        var s = document.getElementById('load-status');
        if (s) s.textContent = text;
      },
      printErr: function(text) {
        console.error(text);
      },
      onRuntimeInitialized: function() {
        console.log('WASM Runtime initialized');
        setTimeout(function() {
          document.getElementById('loading-overlay').classList.add('hidden');
          document.getElementById('status-text').textContent = 'Pipeline running - click the dots button (bottom-right) to inspect';
        }, 1000);
      }
    };
  </script>
  <script>document.write('<script src="gst-dots-wasm-demo.js?' + _cacheBust + '"><\/script>');</script>
</body>
</html>
