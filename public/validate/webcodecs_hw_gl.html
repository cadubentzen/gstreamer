<!doctype html>
<html>
<head>
  <title>GStreamer WebCodecs HW GL Demo</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #1a1a2e; color: #e0e0e0;
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      height: 100vh; overflow: hidden;
    }
    header {
      background: #16213e; padding: 12px 24px;
      border-bottom: 1px solid #0f3460;
      display: flex; align-items: center; gap: 16px;
    }
    header h1 {
      font-size: 16px; font-weight: 600; color: #e94560;
    }
    header .pipeline {
      font-size: 11px; color: #888; font-family: monospace;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    #status {
      margin-left: auto; font-size: 13px; font-weight: 600;
      padding: 4px 12px; border-radius: 4px;
      background: #0f3460; color: #53a8b6;
    }
    #status.pass { background: #1b4332; color: #95d5b2; }
    #status.fail { background: #4a1527; color: #e94560; }
    .main {
      display: flex; height: calc(100vh - 49px);
    }
    .video-pane {
      flex: 1; display: flex; align-items: center; justify-content: center;
      background: #111; min-width: 0;
    }
    #canvas {
      max-width: 100%; max-height: 100%;
      object-fit: contain;
    }
    .log-pane {
      width: 420px; min-width: 320px;
      background: #0d1117; border-left: 1px solid #21262d;
      display: flex; flex-direction: column;
    }
    .log-header {
      padding: 8px 12px; font-size: 12px; font-weight: 600;
      color: #8b949e; border-bottom: 1px solid #21262d;
      display: flex; justify-content: space-between;
    }
    #seek-counter { color: #53a8b6; }
    #output {
      flex: 1; overflow-y: auto; padding: 8px 12px;
      font-family: 'JetBrains Mono', 'Fira Code', monospace;
      font-size: 11px; line-height: 1.5;
      color: #8b949e; white-space: pre-wrap; word-break: break-all;
    }
    #output .action { color: #79c0ff; }
    #output .done { color: #56d364; }
    #output .err { color: #f85149; }
    #output .result { color: #e3b341; font-weight: bold; }
  </style>
</head>
<body>
  <header>
    <h1>GStreamer WASM</h1>
    <span class="pipeline">webstreamsrc &rarr; qtdemux &rarr; webcodecsviddech264hw &rarr; glimagesink</span>
    <span id="status">Loading...</span>
  </header>
  <div class="main">
    <div class="video-pane">
      <canvas id="canvas" width="640" height="480"></canvas>
    </div>
    <div class="log-pane">
      <div class="log-header">
        <span>Log</span>
        <span id="seek-counter"></span>
      </div>
      <pre id="output"></pre>
    </div>
  </div>
  <script>
    var seekCount = 0, totalSeeks = 100;
    var statusEl = document.getElementById('status');
    var counterEl = document.getElementById('seek-counter');
    var outputEl = document.getElementById('output');

    function appendLog(text, cls) {
      var span = document.createElement('span');
      if (cls) span.className = cls;
      span.textContent = text + '\n';
      outputEl.appendChild(span);
      outputEl.scrollTop = outputEl.scrollHeight;
    }

    var Module = {
      canvas: document.getElementById('canvas'),
      locateFile: function(path) { return '/' + path; },
      preRun: [function() {
        var scenario =
          'set-globals, GST_WASM_MEDIA_URL="' + window.location.origin + '/media"\n' +
          'meta,\n' +
          '    handles-states=true,\n' +
          '    ignore-severities=critical,\n' +
          '    args = {\n' +
          '        "webstreamsrc location=\\"$(GST_WASM_MEDIA_URL)/mp4/timecoded_h264_30fps.mp4\\" ! qtdemux name=demux demux.video_0 ! video/x-h264 ! webcodecsviddech264hw ! glimagesink",\n' +
          '    }\n' +
          'set-state, state=playing\n' +
          'wait, duration=1.0\n' +
          'set-state, state=paused\n';
        var positions = [0, 3, 1, 2, 0, 2, 3, 1];
        for (var i = 0; i < totalSeeks; i++)
          scenario += 'seek, start=' + positions[i % positions.length] + '.0, flags=flush+accurate\n';
        scenario += 'set-state, state=playing\n' +
          'wait, duration=1.0\n' +
          'stop\n';
        FS.writeFile("/test.validatetest", scenario);
      }],
      print: function(text) {
        console.log(text);
        if (text.includes('Action `seek`') && text.includes('done')) {
          seekCount++;
          counterEl.textContent = 'Seeks: ' + seekCount + '/' + totalSeeks;
          statusEl.textContent = 'Seeking ' + seekCount + '/' + totalSeeks;
        }
        if (text.includes('Test PASSED')) {
          appendLog(text, 'result');
          statusEl.textContent = 'PASSED';
          statusEl.className = 'pass';
        } else if (text.includes('Test FAILED')) {
          appendLog(text, 'result');
          statusEl.textContent = 'FAILED';
          statusEl.className = 'fail';
        } else if (text.includes('Executing')) {
          appendLog(text, 'action');
          if (text.includes('set-state') && text.includes('playing'))
            statusEl.textContent = 'Playing';
          else if (text.includes('set-state') && text.includes('paused'))
            statusEl.textContent = 'Paused';
        } else if (text.includes('done')) {
          appendLog(text, 'done');
        } else {
          appendLog(text, '');
        }
      },
      printErr: function(text) {
        console.error(text);
        if (text.includes('ERROR') || text.includes('critical'))
          appendLog(text, 'err');
      },
    };
  </script>
  <script src="/gst-validate-wasm-1.0.js"></script>
</body>
</html>
