<!doctype html>
<html>
<head><title>GStreamer WebCodecs SW GL Demo</title></head>
<body>

  <canvas id="canvas" width="640" height="480" style="border:1px solid #ccc"></canvas>
  <pre id="output" style="max-height:200px;overflow:auto;font-size:11px"></pre>
  <script>
    var Module = {
      canvas: document.getElementById('canvas'),
      locateFile: function(path) { return '/' + path; },
      preRun: [function() {
        FS.writeFile("/test.validatetest",
          'set-globals, GST_WASM_MEDIA_URL="' + window.location.origin + '/media"\n' +
          'meta,\n    args = {\n        "webstreamsrc location=\\"$(GST_WASM_MEDIA_URL)/mp4/raw_h264.0.mp4\\" ! qtdemux name=demux demux.video_0 ! video/x-h264 ! webcodecsviddech264sw ! glimagesink",\n    }\n');
      }],
      print: function(text) {
        console.log(text);
        document.getElementById('output').textContent += text + '\n';
      },
      printErr: function(text) { console.error(text); },
    };
  </script>
  <script src="/gst-validate-wasm-1.0.js"></script>
</body>
</html>
