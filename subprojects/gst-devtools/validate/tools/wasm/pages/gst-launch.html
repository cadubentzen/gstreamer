<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <script src="coi-serviceworker.js"></script>
  <title>GStreamer Validate WASM Runner</title>
  <style>
    :root {
      --bg: #1a1a2e;
      --surface: #16213e;
      --surface2: #0f3460;
      --accent: #e94560;
      --text: #eee;
      --text-dim: #999;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      overflow: hidden;
      height: 100vh;
      display: flex;
      flex-direction: column;
    }

    header {
      background: var(--surface);
      padding: 8px 16px;
      display: flex;
      align-items: center;
      gap: 16px;
      border-bottom: 1px solid var(--surface2);
      flex-shrink: 0;
    }

    header h1 { font-size: 16px; font-weight: 600; color: var(--accent); }
    header .test-name { font-size: 12px; color: var(--text-dim); font-family: monospace; }

    #status {
      margin-left: auto;
      font-size: 13px;
      font-weight: 600;
      padding: 4px 12px;
      border-radius: 4px;
      background: var(--surface2);
      color: #53a8b6;
    }
    #status.pass { background: #1b4332; color: #95d5b2; }
    #status.fail { background: #4a1527; color: #e94560; }

    .main-area {
      display: flex;
      flex: 1;
      min-height: 0;
    }

    .preview-area {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #000;
      min-width: 0;
    }

    #canvas {
      max-width: 100%;
      max-height: 100%;
      background: #111;
    }

    .log-area {
      width: 360px;
      background: var(--surface);
      border-left: 1px solid var(--surface2);
      display: flex;
      flex-direction: column;
      flex-shrink: 0;
    }

    .log-area .log-header {
      padding: 6px 12px;
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: var(--text-dim);
      border-bottom: 1px solid var(--surface2);
      flex-shrink: 0;
    }

    #output {
      flex: 1;
      overflow-y: auto;
      padding: 8px 12px;
      font-family: monospace;
      font-size: 11px;
      white-space: pre-wrap;
      color: var(--text-dim);
      line-height: 1.5;
    }
  </style>
</head>
<body>
  <header>
    <h1>GStreamer Validate WASM Runner</h1>
    <span class="test-name" id="test-name"></span>
    <span id="status">Loading...</span>
  </header>

  <div class="main-area">
    <div class="preview-area">
      <canvas id="canvas" width="1920" height="1080"></canvas>
    </div>
    <div class="log-area">
      <div class="log-header">Log</div>
      <pre id="output"></pre>
    </div>
  </div>

  <script src="dots-viewer/dist/gst-dots-wasm-bundle.js"></script>
  <script>
    var statusEl = document.getElementById('status');

    var params = new URLSearchParams(window.location.search);
    var testPath = params.get('validate-test');
    if (!testPath) {
      document.getElementById('output').textContent = 'Usage: ?validate-test=path/to/test.validatetest';
      throw new Error('No validate-test parameter provided');
    }

    document.getElementById('test-name').textContent = testPath;
    document.getElementById('output').textContent = 'Fetching ' + testPath + '...\n';

    fetch(testPath).then(function(response) {
      if (!response.ok)
        throw new Error('Failed to fetch ' + testPath + ': ' + response.status);
      return response.text();
    }).then(function(testFile) {
      document.getElementById('output').textContent += 'Starting...\n';

      var Module = {
        canvas: document.getElementById('canvas'),
        locateFile: function(path) { return path; },
        onAbort: function(what) {
          console.error('WASM ABORT: ' + what);
          statusEl.textContent = 'ERROR';
          statusEl.className = 'fail';
        },
        preRun: [function() {
          FS.writeFile('/test.validatetest', testFile);
          ENV["GST_DEBUG"] = "*:2";
          ENV["GST_DEBUG_NO_COLOR"] = "1";
          ENV["GST_TRACERS"] = "dots";
        }],
        print: function(text) {
          console.log(text);
          var el = document.getElementById('output');
          el.textContent += text + '\n';
          el.scrollTop = el.scrollHeight;

          if (text.includes('Test PASSED')) {
            statusEl.textContent = 'PASSED';
            statusEl.className = 'pass';
          } else if (text.includes('Test FAILED')) {
            statusEl.textContent = 'FAILED';
            statusEl.className = 'fail';
          } else if (text.includes('set-state') && text.includes('playing')) {
            statusEl.textContent = 'Playing';
          } else if (text.includes('set-state') && text.includes('paused')) {
            statusEl.textContent = 'Paused';
          }
        },
        printErr: function(text) {
          if (/abort|error|fatal|critical/i.test(text)) {
            var el = document.getElementById('output');
            el.textContent += text + '\n';
            el.scrollTop = el.scrollHeight;
          }
        },
      };

      window.Module = Module;
      var script = document.createElement('script');
      script.src = 'gst-validate-wasm-1.0.js';
      document.body.appendChild(script);

      statusEl.textContent = 'Running';
    }).catch(function(err) {
      document.getElementById('output').textContent += 'ERROR: ' + err.message + '\n';
      statusEl.textContent = 'ERROR';
      statusEl.className = 'fail';
    });
  </script>
</body>
</html>
