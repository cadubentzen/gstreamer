<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>GES Web Editor</title>
  <style>
    :root {
      --bg: #1a1a2e;
      --surface: #16213e;
      --surface2: #0f3460;
      --accent: #e94560;
      --accent2: #533483;
      --text: #eee;
      --text-dim: #999;
      --clip-color: #e94560;
      --clip-color2: #533483;
      --clip-color3: #0f3460;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      overflow: hidden;
      height: 100vh;
      display: flex;
      flex-direction: column;
    }

    header {
      background: var(--surface);
      padding: 8px 16px;
      display: flex;
      align-items: center;
      gap: 16px;
      border-bottom: 1px solid var(--surface2);
      flex-shrink: 0;
    }

    header h1 {
      font-size: 16px;
      font-weight: 600;
      color: var(--accent);
    }

    header .badge {
      font-size: 10px;
      background: var(--accent2);
      padding: 2px 8px;
      border-radius: 10px;
      color: var(--text-dim);
    }

    .main-area {
      display: flex;
      flex: 1;
      min-height: 0;
    }

    /* Sidebar */
    .sidebar {
      width: 220px;
      background: var(--surface);
      border-right: 1px solid var(--surface2);
      display: flex;
      flex-direction: column;
      flex-shrink: 0;
    }

    .sidebar h2 {
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: var(--text-dim);
      padding: 12px 12px 6px;
    }

    .sidebar button {
      display: block;
      width: calc(100% - 16px);
      margin: 3px 8px;
      padding: 8px 10px;
      background: var(--surface2);
      border: 1px solid transparent;
      border-radius: 6px;
      color: var(--text);
      font-size: 12px;
      cursor: pointer;
      text-align: left;
      transition: all 0.15s;
    }

    .sidebar button:hover {
      border-color: var(--accent);
      background: #1a2a4e;
    }

    .sidebar button .icon {
      display: inline-block;
      width: 18px;
      text-align: center;
      margin-right: 4px;
    }

    .sidebar .effects-section button {
      font-size: 11px;
      padding: 6px 10px;
    }

    /* Canvas + Controls */
    .preview-area {
      flex: 1;
      display: flex;
      flex-direction: column;
      min-width: 0;
    }

    .canvas-container {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #000;
      min-height: 200px;
      position: relative;
    }

    #canvas {
      max-width: 100%;
      max-height: 100%;
      background: #111;
    }

    .canvas-overlay {
      position: absolute;
      top: 8px;
      right: 8px;
      background: rgba(0,0,0,0.7);
      padding: 4px 10px;
      border-radius: 4px;
      font-size: 11px;
      font-family: monospace;
      color: var(--text-dim);
    }

    /* Transport Controls */
    .transport {
      background: var(--surface);
      border-top: 1px solid var(--surface2);
      border-bottom: 1px solid var(--surface2);
      padding: 8px 16px;
      display: flex;
      align-items: center;
      gap: 12px;
      flex-shrink: 0;
    }

    .transport button {
      background: none;
      border: 1px solid var(--surface2);
      color: var(--text);
      width: 36px;
      height: 36px;
      border-radius: 50%;
      cursor: pointer;
      font-size: 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.15s;
    }

    .transport button:hover {
      border-color: var(--accent);
      background: var(--surface2);
    }

    .transport button.play-btn {
      width: 44px;
      height: 44px;
      border-color: var(--accent);
      background: var(--accent);
      font-size: 20px;
    }

    .transport button.play-btn:hover {
      background: #d03050;
    }

    .transport .timecode {
      font-family: 'Courier New', monospace;
      font-size: 14px;
      color: var(--text);
      min-width: 120px;
    }

    .transport .timecode span {
      color: var(--text-dim);
      font-size: 12px;
    }

    .seek-bar-container {
      flex: 1;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .seek-bar {
      flex: 1;
      -webkit-appearance: none;
      appearance: none;
      height: 4px;
      background: var(--surface2);
      border-radius: 2px;
      outline: none;
      cursor: pointer;
    }

    .seek-bar::-webkit-slider-thumb {
      -webkit-appearance: none;
      width: 14px;
      height: 14px;
      background: var(--accent);
      border-radius: 50%;
      cursor: pointer;
    }

    /* Timeline */
    .timeline-area {
      height: 200px;
      background: var(--surface);
      display: flex;
      flex-direction: column;
      flex-shrink: 0;
    }

    .timeline-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 4px 12px;
      border-bottom: 1px solid var(--surface2);
      flex-shrink: 0;
    }

    .timeline-header .left {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .timeline-header h3 {
      font-size: 12px;
      font-weight: 500;
    }

    .timeline-header button {
      background: var(--surface2);
      border: none;
      color: var(--text);
      padding: 4px 10px;
      border-radius: 4px;
      font-size: 11px;
      cursor: pointer;
    }

    .timeline-header button:hover {
      background: var(--accent2);
    }

    .timeline-ruler {
      height: 24px;
      background: var(--bg);
      border-bottom: 1px solid var(--surface2);
      position: relative;
      overflow: hidden;
      flex-shrink: 0;
    }

    .timeline-ruler canvas {
      width: 100%;
      height: 100%;
    }

    .timeline-layers {
      flex: 1;
      overflow-y: auto;
      overflow-x: hidden;
      position: relative;
    }

    .timeline-layer {
      height: 50px;
      border-bottom: 1px solid var(--surface2);
      position: relative;
      display: flex;
    }

    .layer-label {
      width: 80px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 10px;
      color: var(--text-dim);
      background: var(--bg);
      border-right: 1px solid var(--surface2);
      flex-shrink: 0;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    .layer-content {
      flex: 1;
      position: relative;
      overflow: hidden;
    }

    .timeline-clip {
      position: absolute;
      top: 4px;
      height: calc(100% - 8px);
      border-radius: 4px;
      display: flex;
      align-items: center;
      padding: 0 8px;
      font-size: 11px;
      font-weight: 500;
      cursor: pointer;
      border: 1px solid rgba(255,255,255,0.15);
      transition: border-color 0.15s;
      overflow: hidden;
      white-space: nowrap;
      text-overflow: ellipsis;
      user-select: none;
    }

    .timeline-clip:hover {
      border-color: rgba(255,255,255,0.5);
    }

    .timeline-clip.selected {
      border-color: #fff;
      box-shadow: 0 0 0 1px #fff;
    }

    .timeline-playhead {
      position: absolute;
      top: 0;
      bottom: 0;
      width: 2px;
      background: var(--accent);
      z-index: 10;
      pointer-events: none;
    }

    .timeline-playhead::before {
      content: '';
      position: absolute;
      top: 0;
      left: -5px;
      width: 12px;
      height: 8px;
      background: var(--accent);
      clip-path: polygon(0 0, 100% 0, 50% 100%);
    }

    /* Status Bar */
    .status-bar {
      background: var(--surface2);
      padding: 4px 16px;
      font-size: 11px;
      color: var(--text-dim);
      display: flex;
      justify-content: space-between;
      flex-shrink: 0;
    }

    /* Loading overlay */
    #loading-overlay {
      position: fixed;
      inset: 0;
      background: var(--bg);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 1000;
      transition: opacity 0.5s;
    }

    #loading-overlay.hidden {
      opacity: 0;
      pointer-events: none;
    }

    #loading-overlay h1 {
      color: var(--accent);
      margin-bottom: 16px;
    }

    #loading-overlay .spinner {
      width: 40px;
      height: 40px;
      border: 3px solid var(--surface2);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin { to { transform: rotate(360deg); } }

    #loading-overlay p {
      margin-top: 16px;
      color: var(--text-dim);
      font-size: 13px;
    }

    #loading-overlay #load-status {
      margin-top: 8px;
      color: var(--text-dim);
      font-size: 11px;
      font-family: monospace;
    }
  </style>
</head>
<body>
  <!-- Loading Overlay -->
  <div id="loading-overlay">
    <h1>GES Web Editor</h1>
    <div class="spinner"></div>
    <p>Loading GStreamer Editing Services...</p>
    <div id="load-status"></div>
  </div>

  <header>
    <h1>GES Web Editor</h1>
    <span class="badge">powered by GStreamer + WASM</span>
  </header>

  <div class="main-area">
    <!-- Sidebar -->
    <div class="sidebar">
      <h2>Add Clips</h2>
      <button onclick="addClip(0)"><span class="icon">&#9638;</span> SMPTE Bars</button>
      <button onclick="addClip(1)"><span class="icon">&#9681;</span> Snow</button>
      <button onclick="addClip(2)"><span class="icon">&#9632;</span> Solid Black</button>
      <button onclick="addClip(18)"><span class="icon">&#9679;</span> Bouncing Ball</button>
      <button onclick="addClip(20)"><span class="icon">&#9686;</span> Gradient</button>
      <button onclick="addClip(23)"><span class="icon">&#9783;</span> Checkers</button>
      <button onclick="addClip(24)"><span class="icon">&#9635;</span> Pinwheel</button>
      <button onclick="addClip(10)"><span class="icon">&#9684;</span> Circular</button>

      <div class="effects-section">
        <h2>Effects</h2>
        <button onclick="addEffect('videoflip method=horizontal-flip')"><span class="icon">&#8596;</span> Horizontal Flip</button>
        <button onclick="addEffect('videoflip method=vertical-flip')"><span class="icon">&#8597;</span> Vertical Flip</button>
        <button onclick="addEffect('videoflip method=clockwise')"><span class="icon">&#8635;</span> Rotate 90</button>
        <button onclick="addEffect('gleffects effect=2')"><span class="icon">&#10070;</span> Sepia (GL)</button>
        <button onclick="addEffect('gleffects effect=3')"><span class="icon">&#9670;</span> Fisheye (GL)</button>
        <button onclick="addEffect('gleffects effect=5')"><span class="icon">&#10023;</span> Glow (GL)</button>
        <button onclick="addEffect('gleffects effect=10')"><span class="icon">&#9731;</span> Blur (GL)</button>
        <button onclick="addEffect('gleffects effect=14')"><span class="icon">&#9673;</span> Bulge (GL)</button>

        <h2>Actions</h2>
        <button onclick="splitSelectedClip()"><span class="icon">&#9986;</span> Split at Playhead</button>
        <button onclick="removeSelectedClip()"><span class="icon">&#10006;</span> Delete Selected</button>
      </div>
    </div>

    <!-- Preview + Controls -->
    <div class="preview-area">
      <div class="canvas-container">
        <canvas id="canvas" width="640" height="360"></canvas>
        <div class="canvas-overlay" id="resolution-label">640x360</div>
      </div>

      <!-- Transport Controls -->
      <div class="transport">
        <button onclick="seekToStart()" title="Go to start">&#9198;</button>
        <button class="play-btn" id="play-btn" onclick="togglePlayback()" title="Play/Pause">&#9654;</button>
        <button onclick="seekToEnd()" title="Go to end">&#9197;</button>

        <div class="timecode">
          <span id="position-display">00:00.000</span>
          <span> / </span>
          <span id="duration-display">00:00.000</span>
        </div>

        <div class="seek-bar-container">
          <input type="range" class="seek-bar" id="seek-bar" min="0" max="1000" value="0" step="1"
                 oninput="onSeek(this.value)">
        </div>
      </div>

      <!-- Timeline -->
      <div class="timeline-area">
        <div class="timeline-header">
          <div class="left">
            <h3>Timeline</h3>
            <button onclick="addLayer()">+ Layer</button>
            <button onclick="zoomIn()">Zoom +</button>
            <button onclick="zoomOut()">Zoom -</button>
          </div>
        </div>
        <div class="timeline-ruler">
          <canvas id="ruler-canvas"></canvas>
        </div>
        <div class="timeline-layers" id="timeline-layers">
          <!-- Layers rendered dynamically -->
        </div>
      </div>
    </div>
  </div>

  <div class="status-bar">
    <span id="status-text">Initializing...</span>
    <span id="status-right">GStreamer Editing Services</span>
  </div>

  <script>
    // --- App State ---
    let pixelsPerSecond = 80;
    let selectedClip = null; // { layer: int, clip: int }
    let animFrameId = null;
    let isReady = false;

    const CLIP_COLORS = [
      '#e94560', '#533483', '#0f3460', '#e97d20', '#20e9a0',
      '#2080e9', '#9020e9', '#e92080', '#60e920', '#e9e920'
    ];

    // --- Emscripten Module ---
    var _cacheBust = 'v=' + Date.now();
    var Module = {
      canvas: document.getElementById('canvas'),
      locateFile: function(path) {
        return path + '?' + _cacheBust;
      },
      print: function(text) {
        console.log(text);
        const s = document.getElementById('load-status');
        if (s) s.textContent = text;
      },
      printErr: function(text) {
        console.error(text);
      },
      onRuntimeInitialized: function() {
        console.log('WASM Runtime initialized');
        setTimeout(() => {
          isReady = true;
          document.getElementById('loading-overlay').classList.add('hidden');
          document.getElementById('status-text').textContent = 'Ready';
          startUIUpdate();
        }, 1500);
      }
    };

    // --- Utility ---
    function formatTime(seconds) {
      if (!isFinite(seconds) || seconds < 0) seconds = 0;
      const m = Math.floor(seconds / 60);
      const s = seconds % 60;
      return String(m).padStart(2, '0') + ':' + s.toFixed(3).padStart(6, '0');
    }

    // --- Transport Controls ---
    function togglePlayback() {
      if (!isReady) return;
      Module._ges_web_app_toggle_playback();
      updatePlayButton();
    }

    function seekToStart() {
      if (!isReady) return;
      Module._ges_web_app_seek(0);
    }

    function seekToEnd() {
      if (!isReady) return;
      const dur = Module._ges_web_app_get_duration();
      Module._ges_web_app_seek(Math.max(0, dur - 0.1));
    }

    function onSeek(value) {
      if (!isReady) return;
      const dur = Module._ges_web_app_get_duration();
      const pos = (value / 1000) * dur;
      Module._ges_web_app_seek(pos);
    }

    function updatePlayButton() {
      if (!isReady) return;
      const playing = Module._ges_web_app_is_playing();
      document.getElementById('play-btn').innerHTML = playing ? '&#9646;&#9646;' : '&#9654;';
    }

    // --- Clip Management ---
    function addClip(pattern) {
      if (!isReady) return;
      const dur = Module._ges_web_app_get_duration();
      const start = dur > 0 ? dur : 0;
      Module._ges_web_app_add_test_clip(0, pattern, start, 5.0);
      refreshTimeline();
    }

    function addEffect(desc) {
      if (!isReady || !selectedClip) {
        alert('Select a clip first');
        return;
      }
      const ptr = Module.stringToNewUTF8(desc);
      Module._ges_web_app_add_effect(selectedClip.layer, selectedClip.clip, ptr);
      Module._free(ptr);
      refreshTimeline();
    }

    function removeSelectedClip() {
      if (!isReady || !selectedClip) return;
      Module._ges_web_app_remove_clip(selectedClip.layer, selectedClip.clip);
      selectedClip = null;
      refreshTimeline();
    }

    function splitSelectedClip() {
      if (!isReady || !selectedClip) return;
      const pos = Module._ges_web_app_get_position();
      Module._ges_web_app_split_clip(selectedClip.layer, selectedClip.clip, pos);
      refreshTimeline();
    }

    function addLayer() {
      if (!isReady) return;
      Module._ges_web_app_add_layer();
      refreshTimeline();
    }

    // --- Zoom ---
    function zoomIn() {
      pixelsPerSecond = Math.min(400, pixelsPerSecond * 1.3);
      refreshTimeline();
    }

    function zoomOut() {
      pixelsPerSecond = Math.max(20, pixelsPerSecond / 1.3);
      refreshTimeline();
    }

    // --- Timeline Rendering ---
    function refreshTimeline() {
      if (!isReady) return;

      const container = document.getElementById('timeline-layers');
      container.innerHTML = '';

      const layerCount = Module._ges_web_app_get_layer_count();
      const totalDuration = Module._ges_web_app_get_duration();

      for (let l = 0; l < layerCount; l++) {
        const layerEl = document.createElement('div');
        layerEl.className = 'timeline-layer';

        const label = document.createElement('div');
        label.className = 'layer-label';
        label.textContent = 'Layer ' + l;
        layerEl.appendChild(label);

        const content = document.createElement('div');
        content.className = 'layer-content';

        const clipCount = Module._ges_web_app_get_clip_count(l);
        for (let c = 0; c < clipCount; c++) {
          const start = Module._ges_web_app_get_clip_start(l, c);
          const duration = Module._ges_web_app_get_clip_duration(l, c);

          const clipEl = document.createElement('div');
          clipEl.className = 'timeline-clip';
          if (selectedClip && selectedClip.layer === l && selectedClip.clip === c) {
            clipEl.classList.add('selected');
          }

          const color = CLIP_COLORS[(l * 7 + c) % CLIP_COLORS.length];
          clipEl.style.background = color;
          clipEl.style.left = (start * pixelsPerSecond) + 'px';
          clipEl.style.width = Math.max(20, duration * pixelsPerSecond) + 'px';

          clipEl.textContent = formatTime(start) + ' (' + duration.toFixed(1) + 's)';
          clipEl.title = 'Layer ' + l + ' / Clip ' + c + '\nStart: ' + formatTime(start) + '\nDuration: ' + duration.toFixed(2) + 's';

          const layerIdx = l;
          const clipIdx = c;
          clipEl.addEventListener('click', (e) => {
            e.stopPropagation();
            selectedClip = { layer: layerIdx, clip: clipIdx };
            refreshTimeline();
          });

          content.appendChild(clipEl);
        }

        layerEl.appendChild(content);
        container.appendChild(layerEl);
      }

      drawRuler(totalDuration);
    }

    function drawRuler(totalDuration) {
      const rulerCanvas = document.getElementById('ruler-canvas');
      const rect = rulerCanvas.parentElement.getBoundingClientRect();
      rulerCanvas.width = rect.width;
      rulerCanvas.height = rect.height;

      const ctx = rulerCanvas.getContext('2d');
      ctx.fillStyle = '#111';
      ctx.fillRect(0, 0, rulerCanvas.width, rulerCanvas.height);

      // Determine tick interval based on zoom
      let tickInterval = 1;
      if (pixelsPerSecond < 30) tickInterval = 5;
      else if (pixelsPerSecond < 60) tickInterval = 2;
      else if (pixelsPerSecond > 200) tickInterval = 0.5;

      const labelOffset = 80; // Account for layer label width
      const visibleDuration = Math.max(totalDuration + 5, 30);

      ctx.strokeStyle = '#333';
      ctx.fillStyle = '#777';
      ctx.font = '9px monospace';
      ctx.textAlign = 'center';

      for (let t = 0; t <= visibleDuration; t += tickInterval) {
        const x = labelOffset + t * pixelsPerSecond;
        if (x > rulerCanvas.width) break;

        ctx.beginPath();
        const isMajor = (t % (tickInterval * 2) === 0) || tickInterval >= 1;
        if (isMajor) {
          ctx.moveTo(x, 14);
          ctx.lineTo(x, rulerCanvas.height);
          ctx.fillText(formatTime(t), x, 12);
        } else {
          ctx.moveTo(x, 18);
          ctx.lineTo(x, rulerCanvas.height);
        }
        ctx.stroke();
      }
    }

    function updatePlayhead() {
      if (!isReady) return;

      const pos = Module._ges_web_app_get_position();
      const dur = Module._ges_web_app_get_duration();

      // Update timecode display
      document.getElementById('position-display').textContent = formatTime(pos);
      document.getElementById('duration-display').textContent = formatTime(dur);

      // Update seek bar
      const seekBar = document.getElementById('seek-bar');
      if (dur > 0 && !seekBar.matches(':active')) {
        seekBar.value = (pos / dur) * 1000;
      }

      // Update playhead position in timeline
      const layers = document.getElementById('timeline-layers');
      let playhead = layers.querySelector('.timeline-playhead');
      if (!playhead) {
        playhead = document.createElement('div');
        playhead.className = 'timeline-playhead';
        layers.appendChild(playhead);
      }
      playhead.style.left = (80 + pos * pixelsPerSecond) + 'px';
    }

    // --- UI Update Loop ---
    function startUIUpdate() {
      refreshTimeline();

      function update() {
        updatePlayhead();
        updatePlayButton();
        animFrameId = requestAnimationFrame(update);
      }
      update();
    }

    // --- Keyboard shortcuts ---
    document.addEventListener('keydown', (e) => {
      if (!isReady) return;

      switch (e.code) {
        case 'Space':
          e.preventDefault();
          togglePlayback();
          break;
        case 'ArrowLeft':
          e.preventDefault();
          Module._ges_web_app_seek(Math.max(0, Module._ges_web_app_get_position() - 1));
          break;
        case 'ArrowRight':
          e.preventDefault();
          Module._ges_web_app_seek(Module._ges_web_app_get_position() + 1);
          break;
        case 'Home':
          e.preventDefault();
          seekToStart();
          break;
        case 'End':
          e.preventDefault();
          seekToEnd();
          break;
        case 'Delete':
        case 'Backspace':
          e.preventDefault();
          removeSelectedClip();
          break;
        case 'KeyS':
          if (e.ctrlKey || e.metaKey) {
            e.preventDefault();
            splitSelectedClip();
          }
          break;
        case 'Equal':
          zoomIn();
          break;
        case 'Minus':
          zoomOut();
          break;
      }
    });

    // Click on timeline background deselects
    document.getElementById('timeline-layers').addEventListener('click', () => {
      selectedClip = null;
      refreshTimeline();
    });

    // Resize handler for ruler
    window.addEventListener('resize', () => {
      if (isReady) {
        const dur = Module._ges_web_app_get_duration();
        drawRuler(dur);
      }
    });
  </script>
  <script>document.write('<script src="ges-web-app-1.0.js?' + _cacheBust + '"><\/script>');</script>
</body>
</html>
